[package]
name = "manifest-gen"
version = "0.1.0"
edition = "2021"
description = "KeyOS firmware manifest generator"
authors = ["Foundation Devices"]

[dependencies]
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
colored = "2.0"
